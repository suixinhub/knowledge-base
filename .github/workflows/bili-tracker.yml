name: Bili Tracker (手动兜底)

# 注意：B站会拦截海外服务器 IP（GitHub Actions 的美国机房实测全部被风控），
# 所以日常采集在本机定时任务执行（WorkBuddy 自动化，每天 09:30）。
# 这个工作流只保留手动触发，用于偶尔验证 Actions 侧是否已放行。

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bili-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch stats
        run: python tracker/fetch_bili_stats.py

      - name: Commit & Push
        run: |
          git config user.name "bili-tracker[bot]"
          git config user.email "bili-tracker[bot]@users.noreply.github.com"
          git add data/stats.csv "docs/自媒体运营/B站数据跟踪.md"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(bili): 数据快照 $(TZ=Asia/Shanghai date +%F)（Actions 兜底）"
            git push
          fi
