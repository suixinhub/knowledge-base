name: Bili Tracker

on:
  schedule:
    - cron: "30 1 * * *"   # 每天 01:30 UTC = 北京时间 09:30
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bili-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch stats
        run: python tracker/fetch_bili_stats.py

      - name: Commit & Push
        run: |
          git config user.name "bili-tracker[bot]"
          git config user.email "bili-tracker[bot]@users.noreply.github.com"
          git add data/stats.csv "docs/自媒体运营/B站数据跟踪.md"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(bili): 每日数据快照 $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
